name: Backpack market collection
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/market/collect.ts'
      - 'scripts/market/state.ts'
      - 'scripts/market/publish.py'
      - 'scripts/market/publication-check.mjs'
      - 'tests/market-publication.test.mjs'
      - 'lib/pool-*.ts'
      - 'lib/stock-pools.ts'
      - 'lib/market-data.ts'
      - 'lib/market-scheduler.ts'
      - 'lib/backpack-registry.ts'
      - '.github/workflows/market-data.yml'
permissions:
  contents: read
concurrency:
  group: backpack-market-collection
  cancel-in-progress: false
jobs:
  collect:
    # Public repository + standard runner only: no paid runner or provider subscription.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify the public observation contract before collection
        run: node --test tests/market-publication.test.mjs
      - name: Compile the shared collector without application dependencies
        run: npx --yes esbuild@0.25.12 scripts/market/collect.ts --bundle --platform=node --format=esm --outfile=/tmp/float-market-collector.mjs
      - name: Collect verified listings and pool observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node /tmp/float-market-collector.mjs
      - name: Publish public snapshot only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/market/publish.py
